<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Denis Lazarini | Engenheiro Agrônomo</title>

    <style>
        /* =====================================================
           CONFIGURAÇÕES GERAIS
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            background: #07140d;
        }

        body {
            width: 100%;
            min-height: 100dvh;
            margin: 0;
            padding: 0;

            background: #07140d;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow-x: hidden;
        }


        /* =====================================================
           CARTÃO
           
           A arte possui proporção 863 × 1823.
           
           O cartão sempre acompanha a largura da tela.
           Não usamos altura fixa, evitando problemas com
           a barra de endereço do Chrome.
        ===================================================== */

        .cartao {
            position: relative;

            width: min(100vw, 863px);

            aspect-ratio: 863 / 1823;

            flex-shrink: 0;

            background-image: url("foto.png");

            background-size: 100% 100%;

            background-repeat: no-repeat;

            background-position: center top;

            overflow: hidden;

            user-select: none;
            -webkit-user-select: none;

            -webkit-touch-callout: none;
        }


        /* =====================================================
           BOTÕES INVISÍVEIS
           
           Eles não possuem:
           - cor
           - borda
           - texto
           - sombra
           
           São apenas áreas clicáveis sobre a arte.
        ===================================================== */

        .botao {
            position: absolute;

            display: block;

            background: transparent;

            border: none;

            outline: none;

            text-decoration: none;

            cursor: pointer;

            z-index: 50;

            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           WHATSAPP
        ===================================================== */

        .whatsapp {
            left: 20.2%;
            top: 56.3%;

            width: 59.4%;
            height: 6.7%;
        }


        /* =====================================================
           TELEFONE
        ===================================================== */

        .telefone {
            left: 20.2%;
            top: 64.3%;

            width: 59.4%;
            height: 6.7%;
        }


        /* =====================================================
           E-MAIL
        ===================================================== */

        .email {
            left: 20.2%;
            top: 72.2%;

            width: 59.4%;
            height: 6.7%;
        }


        /* =====================================================
           INSTAGRAM
        ===================================================== */

        .instagram {
            left: 20.2%;
            top: 80.1%;

            width: 59.4%;
            height: 6.7%;
        }


        /* =====================================================
           REMOVE EFEITOS VISUAIS DOS LINKS
        ===================================================== */

        .botao:hover,
        .botao:focus,
        .botao:active {
            background: transparent;
            border: none;
            outline: none;
        }


        /* =====================================================
           COMPUTADOR
        ===================================================== */

        @media (min-width: 864px) {

            body {
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .cartao {
                width: 863px;
            }
        }

    </style>
</head>


<body>

    <main class="cartao">

        <!-- =================================================
             WHATSAPP
             
             Número correto:
             12 996500517
        ================================================== -->

        <a
            href="https://wa.me/5512996500517"
            class="botao whatsapp"
            aria-label="WhatsApp"
        ></a>


        <!-- =================================================
             TELEFONE
        ================================================== -->

        <a
            href="tel:+5521982208449"
            class="botao telefone"
            aria-label="Telefone"
        ></a>


        <!-- =================================================
             E-MAIL
        ================================================== -->

        <a
            href="mailto:contato@denislazarini.com"
            class="botao email"
            aria-label="E-mail"
        ></a>


        <!-- =================================================
             INSTAGRAM
        ================================================== -->

        <a
            href="https://www.instagram.com/denislazarini"
            class="botao instagram"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
        ></a>

    </main>

</body>
</html>
