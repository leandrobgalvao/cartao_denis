<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Denis Lazarini | Engenheiro Agrônomo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #07140d;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .cartao {
            position: relative;

            /*
             * Mantém exatamente a proporção
             * original da arte: 864 x 1821
             */
            width: min(100vw, 864px);
            aspect-ratio: 864 / 1821;

            background-image: url("cartao-denis.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;

            overflow: hidden;
        }

        /*
         * Links transparentes sobre os botões
         */
        .botao {
            position: absolute;
            display: block;

            background: transparent;
            border: none;

            cursor: pointer;

            /*
             * Evita qualquer alteração visual
             */
            text-decoration: none;

            /*
             * Garante que o clique seja recebido
             */
            z-index: 10;
        }

        /*
         * WHATSAPP
         *
         * Coordenadas aproximadas da arte:
         * x = 170px
         * y = 1120px
         * largura = 525px
         * altura = 126px
         */
        .whatsapp {
            left: 19.7%;
            top: 61.5%;
            width: 60.8%;
            height: 7.0%;
        }

        /*
         * TELEFONE
         */
        .telefone {
            left: 19.7%;
            top: 68.7%;
            width: 60.8%;
            height: 7.0%;
        }

        /*
         * E-MAIL
         */
        .email {
            left: 19.7%;
            top: 75.9%;
            width: 60.8%;
            height: 7.0%;
        }

        /*
         * Efeito visual apenas durante o toque/clique.
         * Pode remover se quiser os botões 100% invisíveis.
         */
        .botao:active {
            background: rgba(255, 255, 255, 0.04);
        }

        /*
         * Evita seleção da imagem no celular
         */
        .cartao {
            user-select: none;
            -webkit-user-select: none;
        }

        /*
         * Evita menu de imagem ao tocar e segurar
         */
        .cartao {
            -webkit-touch-callout: none;
        }
    </style>
</head>

<body>

    <main class="cartao">

        <!-- BOTÃO WHATSAPP -->
        <a
            class="botao whatsapp"
            href="https://wa.me/5512996505017"
            aria-label="Entrar em contato pelo WhatsApp"
        ></a>

        <!-- BOTÃO TELEFONE -->
        <a
            class="botao telefone"
            href="tel:+5521982208449"
            aria-label="Ligar para Denis Lazarini"
        ></a>

        <!-- BOTÃO E-MAIL -->
        <a
            class="botao email"
            href="mailto:contato@denislazarini.com"
            aria-label="Enviar e-mail"
        ></a>

    </main>

</body>
</html>
