<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denis Lazarini - Engenheiro Agrônomo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b1a0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Estilo base de cada área clicável transparente */
        .btn-overlay {
            position: absolute;
            left: 19.5%;
            width: 61%;
            height: 6.8%;
            border-radius: 24px;
            text-decoration: none;
            display: block;
        }

        /* Posições individuais calibradas para cada botão */
        .btn-whatsapp {
            bottom: 28.5%;
        }

        .btn-telefone {
            bottom: 19.8%;
        }

        .btn-email {
            bottom: 11.1%;
        }

        /* Feedback visual sutil de toque */
        .btn-overlay:active {
            background: rgba(46, 125, 50, 0.25);
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <img src="foto.png" alt="Denis Lazarini - Engenheiro Agrônomo" class="card-img">

        <!-- Botões transparentes sobrepostos -->
        <a href="https://wa.me/5512996500517" target="_blank" class="btn-overlay btn-whatsapp" title="WhatsApp"></a>
        <a href="tel:+5521982208449" class="btn-overlay btn-telefone" title="Telefone"></a>
        <a href="mailto:contato@denislazarini.com" class="btn-overlay btn-email" title="E-mail"></a>
    </div>

</body>
</html>
