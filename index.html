<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Denis Lazarini | Engenheiro Agrônomo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #07140d;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /*
        =========================================================
        CARTÃO
        =========================================================
        A arte original possui 863 x 1823 px.
        Mantemos a mesma proporção para que os botões
        permaneçam exatamente sobre a arte.
        */

        .cartao {
            position: relative;

            width: min(100vw, 863px);

            aspect-ratio: 863 / 1823;

            background-image: url("foto.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;

            overflow: hidden;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }


        /*
        =========================================================
        ÁREA CLICÁVEL
        =========================================================

        Os links são completamente transparentes.

        Não existe texto, cor ou borda neles.
        O usuário enxerga somente a arte.
        */


        .botao {
            position: absolute;

            display: block;

            background: transparent;

            border: 0;

            outline: none;

            text-decoration: none;

            cursor: pointer;

            z-index: 20;

            -webkit-tap-highlight-color: transparent;
        }


        /*
        =========================================================
        WHATSAPP
        =========================================================

        Área aproximada:
        X: 174 → 687
        Y: 1027 → 1149
        */

        .whatsapp {
            left: 20.2%;
            top: 56.3%;

            width: 59.4%;
            height: 6.7%;
        }


        /*
        =========================================================
        TELEFONE
        =========================================================

        Área:
        X: 174 → 687
        Y: 1172 → 1294
        */

        .telefone {
            left: 20.2%;
            top: 64.3%;

            width: 59.4%;
            height: 6.7%;
        }


        /*
        =========================================================
        E-MAIL
        =========================================================

        Área:
        X: 174 → 687
        Y: 1316 → 1438
        */

        .email {
            left: 20.2%;
            top: 72.2%;

            width: 59.4%;
            height: 6.7%;
        }


        /*
        =========================================================
        INSTAGRAM
        =========================================================

        Área:
        X: 174 → 687
        Y: 1460 → 1582
        */

        .instagram {
            left: 20.2%;
            top: 80.1%;

            width: 59.4%;
            height: 6.7%;
        }


        /*
        Remove qualquer efeito visual ao clicar.
        O botão continua completamente invisível.
        */

        .botao:active,
        .botao:focus,
        .botao:hover {
            background: transparent;
            outline: none;
        }


        /*
        =========================================================
        DESKTOP
        =========================================================
        */

        @media (min-width: 864px) {

            body {
                padding: 20px 0;
            }

            .cartao {
                width: 863px;
            }
        }

    </style>
</head>


<body>

    <main class="cartao">

        <!-- WHATSAPP -->
        <a
            class="botao whatsapp"
            href="https://wa.me/5512996500517"
            aria-label="WhatsApp"
        ></a>


        <!-- TELEFONE -->
        <a
            class="botao telefone"
            href="tel:+5521982208449"
            aria-label="Telefone"
        ></a>


        <!-- E-MAIL -->
        <a
            class="botao email"
            href="mailto:contato@denislazarini.com"
            aria-label="E-mail"
        ></a>


        <!-- INSTAGRAM -->
        <a
            class="botao instagram"
            href="https://www.instagram.com/denislazarini"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
        ></a>

    </main>

</body>
</html>
